<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>In-Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: #000000;
            overflow: hidden;
        }

        .Frame {
            position: absolute;
            width: 1950px;
            height: 1330px;
            background-color: #e55420;
            overflow: hidden;
            transform-origin: center center;
        }

        .shake {
            animation: gentleBigShake 0.4s ease-in-out both;
        }

        @keyframes gentleBigShake {
            0%   { transform: scale(var(--game-scale)) translate3d(0, 0, 0); }
            25%  { transform: scale(var(--game-scale)) translate3d(-18px, 6px, 0); }
            50%  { transform: scale(var(--game-scale)) translate3d(16px, -8px, 0); }
            75%  { transform: scale(var(--game-scale)) translate3d(-10px, 4px, 0); }
            100% { transform: scale(var(--game-scale)) translate3d(0, 0, 0); }
        }

        .yellow-particle {
            position: absolute;
            background-color: #ffd700;
            border: 2px solid #e6b800;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.8);
            will-change: transform, opacity;
        }

        .Bg { z-index: -9; }

        .character {
            position: absolute;
            width: 500px;
            z-index: -3;
            left: 0;
            top: 0;
            will-change: transform;
        }

        .Dandelion {
            left: 1400px;
            position: absolute;
            bottom: 200px;
            z-index: -4;
            width: 450px;
        }

        .Bg, .Clouds, .Choices {
            position: absolute;
            left: 0;
            width: 100%;
            object-fit: cover;
        }
        .Choices{
            z-index: 1;
        }

        .Bg {
            top: 370px;
        }

        .SlidingObject {
            position: absolute;
            width: 180px;
            height: auto;
            z-index: 4;
            pointer-events: none;
            will-change: transform;
        }

        .Clouds {
            top: -20%;
            animation: cloudSineMove 2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
            will-change: transform;
        }

        @keyframes cloudSineMove {
            0% {
                transform: translateY(0px);
            }
            100% {
                transform: translateY(40px);
            }
        }

        .sign-target {
            position: absolute;
            left: 550px;
            width: 945px;
            height: 260px;
            z-index: 5;
            background-color: transparent;
            border-radius: 12px;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .sign-target.top    { top: 100px; }
        .sign-target.middle { top: 415px; }
        .sign-target.bottom { top: 730px; }

        .sign-target.correct-highlight {
            animation: highlightPulse 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes highlightPulse {
            0% {
                background-color: rgba(255, 223, 0, 0.65);
                box-shadow: 0 0 40px rgba(255, 215, 0, 0.9), inset 0 0 25px rgba(255, 255, 255, 0.8);
            }
            100% {
                background-color: transparent;
                box-shadow: 0 0 0px rgba(255, 215, 0, 0);
            }
        }

        .dialogue-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 14;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .dialogue-overlay.fade-in {
            opacity: 1;
        }
        .dialogue-overlay.fade-out {
            opacity: 0;
        }

        .dandelion-dialogue-img {
            position: absolute;
            top: 27%;
            left: 10%;
            width: 85%;
            align-items: center;
            justify-content: center;
            object-fit: cover;
            z-index: 16;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .dandelion-dialogue-img.fade-out {
            opacity: 0;
        }
        .dandelion-dialogue-img.fade-in {
            opacity: 1;
        }

        .npcUp {
            position: absolute;
            width: 40%;
            left: 61%;
            margin-top: 30%;
            display: none;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .npcUp.fade-out {
            opacity: 0;
        }
        .npcUp.fade-in {
            opacity: 1;
        }

        .boomerang {
            position: absolute;
            width: 100px;
            z-index: 6;
            display: none;
            will-change: transform;
        }

        .game-status-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 20;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-shadow: 2px 2px 4px #000000;
        }

        .game-status-overlay .answer-key-img {
            width: 110%;
            height: auto;
            object-fit: contain;
            position: absolute;
            top: 0px;
        }

        .game-status-overlay .try-again-img {
            width: 150%;
            bottom: -1.5%;
            height: auto;
            position: absolute;
            object-fit: contain;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .try-again-img.fade-out {
            opacity: 0;
        }
        .try-again-img.fade-in {
            opacity: 1;
        }

        .game-status-overlay h1 {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .game-status-overlay p {
            font-size: 36px;
            margin: 10px 0;
        }
        .EndChoice-D{
            top: 6.25%;
        }

        .EndChoice-Character,.EndChoice-A,.EndChoice-D,.EndChoice-Base{
            width: 100%;
            position: absolute;
        }
        .EndChoice-Character,.EndChoice-A,.EndChoice-D,.EndChoice-Base{
            bottom: 10%;
        }
        .EndChoice-A,.EndChoice-D{
            z-index: 1;
        }

        .AnimationFrame, .TextAfterAnimation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            opacity: 1;
            transition: opacity 1s ease-in-out;
            z-index: 25;
        }

        .TextAfterAnimation {
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 26;
        }

        .TextAfterAnimation.fade-in {
            opacity: 1;
        }

        .AnimationFrame.fade-out, .TextAfterAnimation.fade-out {
            opacity: 0;
        }

        .tutorial-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }

        .tutorial-overlay img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .tutorial-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .tutorial-overlay{
            width: 125%;
        }
        .tutor{
            width: 130%;
            top: 0.2%;
            left: -12%;

            position: absolute;
        }

        #debugCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="Frame" id="mapFrame">
        <div class="tutorial-overlay" id="tutorialOverlay">
            <img src="Assets/Images/Quiz Part/tutorial.png" alt="Tutorial" class="tutor">
        </div>

        <audio class="dansfx" src="Assets/Sounds/DanSFX.mp3"></audio>
        <audio class="birdsfx" src="Assets/Sounds/BirdBG.mp3"></audio>
        <img class="AnimationFrame" id="animFrame" src="Assets/Images/Quiz Part/Animations/Dandelion/Dandelion Animation-01.png">
        <img class="TextAfterAnimation" id="textAfterAnim" src="Assets/Images/Quiz Part/Animations/Dandelion/Dandelion Animation end.png">

        <audio class="hitSound" src="Assets/Sounds/hitSound.mp3"></audio>
        <audio class="swingSound" src="Assets/Sounds/swingSound.mp3"></audio>
        <audio class="eagleSFX" src="Assets/Sounds/Caw.mp3"></audio>
        <img class="character" id="player" src="Assets/Images/Part 2/User/User1 L3.png" alt="Player" />
        <img class="Bg" src="Assets/Images/Quiz Part/Quiz Bg.png"/>
        <img class="Choices" id="choicesImg" src="Assets/Images/Quiz Part/Choices/choice1.png">

        <div class="sign-target top" data-sign="1"></div>
        <div class="sign-target middle" data-sign="2"></div>
        <div class="sign-target bottom" data-sign="3"></div>

        <div class="ColorBg">
            <img class="Clouds" src="Assets/Images/Quiz Part/Quiz Cloud.png">
            <img class="NPC Dandelion" id="dandelion" src="Assets/Images/Part 2/character/Dadelion L4.png">
            
            <div class="dialogue-overlay" id="dialogueBg"></div>

            <div class="DialougeWrapper">
                <img class="dandelion-dialogue-img" id="dandelionDialogue" src="Assets/Images/Quiz Part/Dandelion Dialogue/Dandelion Dialogue1.png" alt="Dandelion Dialogue" />
                <img class="npcUp" id="npcUp" src="Assets/Images/Part 2/character/Dadelion L4.png" alt="NPC Portrait">
            </div>

            <img class="boomerang" id="boomerang" src="Assets/Images/Quiz Part/Boomerang.png" alt="Boomerang" />

            <canvas id="debugCanvas"></canvas>
        </div>

        <div class="game-status-overlay" id="gameOverOverlay">
            <img class="answer-key-img" id="answerKeyImg" src="Assets/Images/Quiz Part/Answer Key/Answer Key1.png" alt="Answer Key" />
            <img class="try-again-img" id="tryAgainImg" src="Assets/Images/Quiz Part/Answer Key/X to try again.png" alt="Press X to go back to Farmer Dialouge" />
        </div>

        <div class="game-status-overlay" id="winOverlay">
            <img class="EndChoice-Character" src="Assets/Images/Quiz Part/EndCharacter/End Dandelion.png">
            <img class="EndChoice-A" src="Assets/Images/Quiz Part/EndCharacter/End A.png">
            <img class="EndChoice-D" src="Assets/Images/Quiz Part/EndCharacter/End D.png">
            <img class="EndChoice-Base" src="Assets/Images/Quiz Part/EndCharacter/End choice.png">
        </div>
    </div>

    <script>
        const GAME_WIDTH = 2400;
        const GAME_HEIGHT = 1080;

        const frame = document.getElementById("mapFrame");
        const playerElem = document.getElementById("player");
        const boomerangElem = document.getElementById("boomerang");
        const choicesElem = document.getElementById("choicesImg");
        const answerKeyElem = document.getElementById("answerKeyImg");
        const dandelionDialogueElem = document.getElementById("dandelionDialogue");
        const npcUpElem = document.getElementById('npcUp');
        const dialogueBgElem = document.getElementById("dialogueBg");
        const canvas = document.getElementById("debugCanvas");
        const ctx = canvas.getContext("2d");
        const hitsfx = document.querySelector(".hitSound");
        const swingsfx = document.querySelector(".swingSound");
        const birdsfx = document.querySelector(".eagleSFX");
        const dnsfx = document.querySelector(".dansfx");
        const bdsfx = document.querySelector(".birdsfx");

        const dandelionElem = document.getElementById("dandelion");
        const gameOverOverlay = document.getElementById("gameOverOverlay");
        const gameOverOverlayText = document.getElementById("tryAgainImg");
        const winOverlay = document.getElementById("winOverlay");

        const animFrameElem = document.getElementById("animFrame");
        const textAfterAnimElem = document.getElementById("textAfterAnim");
        const tutorialOverlay = document.getElementById("tutorialOverlay");

        let slidingObstacles = [];
        let obstacleSpawnTimer = 0;
        const OBSTACLE_SPAWN_INTERVAL = 60; 

        let currentQuestion = 1;
        let currentDialogueIndex = 0; 
        let isDialogueActive = false;  
        let isTransitioning = false;   

        const correctAnswers = {
            1: 2,
            2: 1,
            3: 3
        };

        let isGameOver = false;
        let isWin = false;
        
        let isTutorialActive = true;
        let isCutsceneActive = false;
        let canDismissCutscene = false;

        let currentScale = 1;

        function fitGameToWindow() {
            const scaleX = window.innerWidth / GAME_WIDTH;
            const scaleY = window.innerHeight / GAME_HEIGHT;
            currentScale = Math.min(scaleX, scaleY);

            frame.style.setProperty('--game-scale', currentScale);
            frame.style.transform = `scale(${currentScale})`;
        }

        function resizeCanvas() {
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
        }
        
        window.addEventListener("resize", () => {
            fitGameToWindow();
            resizeCanvas();
        });

        fitGameToWindow();
        resizeCanvas();

        function dismissTutorial() {
            isTutorialActive = false;
            tutorialOverlay.classList.add("fade-out");
            setTimeout(() => {
                tutorialOverlay.style.display = "none";
                startIntroCutscene();
            }, 500);
        }

        function startIntroCutscene() {
            isCutsceneActive = true;
            canDismissCutscene = false;
            animFrameElem.style.display = "block";

            let frameNum = 1;
            let FrameAgain = 1;
            let direction = 1; 
            animFrameElem.src = `Assets/Images/Quiz Part/Animations/Dandelion/Dandelion Animation-0${frameNum}.png`;

            const cutsceneInterval = setInterval(() => {
                frameNum += direction;

                if (frameNum === 4 && direction === 1) {
                    direction = -1;
                }

                if (frameNum === 1 && direction === -1) {
                    direction = 1;
                    FrameAgain++;
                }

                if (frameNum === 2) {
                    dnsfx.play();
                }

                animFrameElem.src = `Assets/Images/Quiz Part/Animations/Dandelion/Dandelion Animation-0${frameNum}.png`;

                if (frameNum === 4 && FrameAgain === 3) {
                    clearInterval(cutsceneInterval);
                    textAfterAnimElem.style.display = "block";
                    
                    setTimeout(() => {
                        textAfterAnimElem.classList.add("fade-in");
                        canDismissCutscene = true;
                    }, 100);
                }
            }, 250);
        }

        function dismissCutscene() {
            canDismissCutscene = false; 
            bdsfx.play()
            
            animFrameElem.classList.add("fade-out");
            textAfterAnimElem.classList.remove("fade-in");
            textAfterAnimElem.classList.add("fade-out");

            setTimeout(() => {
                animFrameElem.style.display = "none";
                textAfterAnimElem.style.display = "none";
                animFrameElem.classList.remove("fade-out");
                textAfterAnimElem.classList.remove("fade-out");
                isCutsceneActive = false; 
            }, 1000);
        }

        function triggerScreenShake() {
            frame.classList.remove("shake");
            void frame.offsetWidth;
            frame.classList.add("shake");

            setTimeout(() => {
                frame.classList.remove("shake");
                frame.style.transform = `scale(${currentScale})`;
            }, 400);
        }

        function highlightCorrectSign(signElem) {
            signElem.classList.remove("correct-highlight");
            void signElem.offsetWidth; 
            signElem.classList.add("correct-highlight");

            setTimeout(() => {
                signElem.classList.remove("correct-highlight");
            }, 500);
        }

        function spawnYellowParticles(signRect) {
            const particleCount = 24;
            const colors = ['#ffd700', '#ffea00', '#fff066', '#e6b800'];

            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement("div");
                p.classList.add("yellow-particle");

                const size = Math.floor(Math.random() * 16) + 12; 
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                let posX = signRect.x + (Math.random() * signRect.width);
                let posY = signRect.y + (Math.random() * signRect.height);

                p.style.left = `${posX}px`;
                p.style.top = `${posY}px`;

                frame.appendChild(p);

                let vx = (Math.random() - 0.5) * 12;
                let vy = (Math.random() - 0.5) * 12 - 4;
                const gravity = 0.5;
                let opacity = 1;
                let rotation = Math.random() * 360;
                let rotSpeed = (Math.random() - 0.5) * 10;

                function animateParticle() {
                    posX += vx;
                    posY += vy;
                    vy += gravity;
                    opacity -= 0.03;
                    rotation += rotSpeed;

                    p.style.transform = `translate(${posX - signRect.x}px, ${posY - signRect.y}px) rotate(${rotation}deg)`;
                    p.style.opacity = opacity;

                    if (opacity > 0) {
                        requestAnimationFrame(animateParticle);
                    } else {
                        p.remove();
                    }
                }

                requestAnimationFrame(animateParticle);
            }
        }

        const PLAYER_WIDTH = 350;
        const PLAYER_HEIGHT = 200;
        const FEET_OFFSET_X = PLAYER_WIDTH / 2;

        const player = {
            x: 50,
            y: 200,
            velX: 0,
            velY: 0,
            speed: 7,
            gravity: 0.6,
            jumpForce: -25,
            isGrounded: false,
            Jumped: 0,
            maxJumps: 2,
            facingDirection: 1,
            canThrow: true
        };

        const boomerang = {
            x: 0,
            y: 0,
            velX: 0,
            speed: 18,
            active: false,
            rotation: 0,
            timer: 0,
            returnDelay: 85,
            maxLifetime: 170,
            hasHitSign: false,
            width: 100,
            height: 100
        };

        const characterFrames = [
            "Assets/Images/Part 2/User/User1 L3.png",
            "Assets/Images/Part 2/User/User2 L3.png",
            "Assets/Images/Part 2/User/User3 L3.png"
        ];
        let currentFrameIndex = 0;
        let animationTimer = 0;
        const animationSpeed = 12;

        const pathPoints = [
            { x: 0.00, y: 1 },
            { x: 1.00, y: 1 }
        ];

        const keys = {
            ArrowUp: false, KeyW: false, KeyZ: false, KeyX: false
        };

        window.addEventListener("keydown", (e) => {
            if (e.code in keys) keys[e.code] = true;

            if (isTransitioning) return;

            if (isTutorialActive) {
                if ((e.code === "KeyZ" || e.code === "KeyX") && !e.repeat) {
                    dismissTutorial();
                }
                return;
            }

            if (isCutsceneActive) {
                if ((e.code === "KeyZ" || e.code === "KeyX") && !e.repeat && canDismissCutscene) {
                    dismissCutscene();
                }
                return;
            }

            if (isDialogueActive) {
                if ((e.code === "KeyZ" || e.code === "KeyX") && !e.repeat) {
                    if (currentDialogueIndex === 2) {
                        setDandelionDialogue(3);
                    } else if (currentDialogueIndex === 1) {
                        currentQuestion = 2;
                        choicesElem.src = `Assets/Images/Quiz Part/Choices/Choice${currentQuestion}.png`;
                        hideDialogue(() => resetBoomerang());
                    } else if (currentDialogueIndex === 3) {
                        currentQuestion = 3;
                        choicesElem.src = `Assets/Images/Quiz Part/Choices/Choice${currentQuestion}.png`;
                        hideDialogue(() => resetBoomerang());
                    } else if (currentDialogueIndex === 4) {
                        hideDialogue(() => triggerWin());
                    }
                }
                return;
            }

            if (isGameOver) {
                if (e.code === "KeyZ" || e.code === "KeyX") {
                    restartGame();
                }
                return;
            }

            if (isWin) {
                localStorage.setItem("Npc1Completed", "true");
                if (e.code === "KeyA") {
                    window.location.href = 'map.html';
                } else if (e.code === "KeyB") {
                    localStorage.setItem("dialogueCompleted", "false");
                    window.location.href = 'theend.html';
                }
                return;
            }

            if ((e.code === "ArrowUp" || e.code === "KeyW" || e.code === "KeyA") && !e.repeat) {
                if (player.Jumped < player.maxJumps) {
                    player.velY = player.jumpForce;
                    player.isGrounded = false;
                    player.Jumped++;
                }
            }

            if (e.code === "KeyB" && !e.repeat) {
                throwBoomerang();
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.code in keys) keys[e.code] = false;

            if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "KeyA") {
                if (player.velY < 0) {
                    player.velY = 0;
                }
            }
        });

        function spawnSlidingObstacle() {
            const img = document.createElement("img");
            img.classList.add("SlidingObject");
            img.src = "Assets/Images/Quiz Part/Bird2.png"; 
            
            const randomY = Math.pow(Math.random(), 2) * (GAME_HEIGHT - 450) + 200;

            const obstacle = {
                element: img,
                x: GAME_WIDTH,
                y: randomY,
                speed: 6 + Math.random() * 2,
                width: 115,
                height: 115
            };

            img.style.top = `${obstacle.y}px`;
            img.style.transform = `translateX(${obstacle.x}px)`;
            frame.appendChild(img);

            slidingObstacles.push(obstacle);
        }
        let HittedBird = false;

        function updateSlidingObstacles() {
            obstacleSpawnTimer++;
            if (obstacleSpawnTimer >= OBSTACLE_SPAWN_INTERVAL) {
                obstacleSpawnTimer = 0;
                spawnSlidingObstacle();
            }

            const playerHitbox = {
                x: player.x + 80, 
                y: player.y + 40,
                width: PLAYER_WIDTH - 160,
                height: PLAYER_HEIGHT - 40
            };

            for (let i = slidingObstacles.length - 1; i >= 0; i--) {
                const obs = slidingObstacles[i];
                obs.x -= obs.speed;
                obs.element.style.transform = `translateX(${obs.x}px)`;

                const obsHitbox = {
                    x: obs.x,
                    y: obs.y,
                    width: obs.width,
                    height: obs.height
                };

                if (isColliding(playerHitbox, obsHitbox)) {
                    clearAllObstacles();
                    HittedBird = true;
                    
                    birdsfx.volume = 0.5;
                    birdsfx.play();
                    triggerGameOver();
                    return;
                }

                if (obs.x < -obs.width) {
                    obs.element.remove();
                    slidingObstacles.splice(i, 1);
                }
            }
        }

        function clearAllObstacles() {
            slidingObstacles.forEach(obs => obs.element.remove());
            slidingObstacles = [];
            obstacleSpawnTimer = 0;
        }

        function throwBoomerang() {
            if (!player.canThrow || boomerang.active || isGameOver || isWin || isDialogueActive || isCutsceneActive || isTutorialActive) return;

            swingsfx.play();
            boomerang.active = true;
            boomerang.hasHitSign = false;
            player.canThrow = false;
            boomerang.timer = 0;
            boomerang.rotation = 0;

            boomerang.x = player.x + FEET_OFFSET_X - (boomerang.width / 2);
            boomerang.y = player.y + (PLAYER_HEIGHT / 2);

            boomerang.velX = player.facingDirection * boomerang.speed;
            boomerangElem.style.display = "block";
        }

        function resetBoomerang() {
            boomerang.active = false;
            player.canThrow = true;
            boomerangElem.style.display = "none";
        }

        function setDandelionDialogue(index) {
            currentDialogueIndex = index;
            isDialogueActive = true;
            isTransitioning = true;

            dandelionDialogueElem.src = `Assets/Images/Quiz Part/Dandelion Dialogue/Dandelion Dialogue${index}.png`;

            dialogueBgElem.style.display = "block";
            dandelionDialogueElem.style.display = "block";
            npcUpElem.style.display = "block";

            requestAnimationFrame(() => {
                dialogueBgElem.classList.remove("fade-out");
                dandelionDialogueElem.classList.remove("fade-out");
                npcUpElem.classList.remove("fade-out");

                dialogueBgElem.classList.add("fade-in");
                dandelionDialogueElem.classList.add("fade-in");
                npcUpElem.classList.add("fade-in");
            });

            setTimeout(() => {
                isTransitioning = false;
            }, 300);
        }

        function hideDialogue(callback) {
            isTransitioning = true;

            dialogueBgElem.classList.remove("fade-in");
            dandelionDialogueElem.classList.remove("fade-in");
            npcUpElem.classList.remove("fade-in");

            dialogueBgElem.classList.add("fade-out");
            dandelionDialogueElem.classList.add("fade-out");
            npcUpElem.classList.add("fade-out");

            setTimeout(() => {
                isDialogueActive = false;
                dialogueBgElem.style.display = "none";
                dandelionDialogueElem.style.display = "none";
                npcUpElem.style.display = "none";
                isTransitioning = false;
                if (callback) callback();
            }, 300);
        }

        function checkSignHits() {
            if (boomerang.hasHitSign || !boomerang.active) return;

            const boomerangHitbox = {
                x: boomerang.x,
                y: boomerang.y,
                width: boomerang.width,
                height: boomerang.height
            };

            const signTargets = document.querySelectorAll('.sign-target');

            signTargets.forEach(sign => {
                const rect = {
                    x: sign.offsetLeft,
                    y: sign.offsetTop,
                    width: sign.offsetWidth,
                    height: sign.offsetHeight
                };

                if (isColliding(boomerangHitbox, rect)) {
                    hitsfx.play();
                    boomerang.hasHitSign = true;

                    const hitSignId = parseInt(sign.getAttribute("data-sign"));
                    const isCorrect = hitSignId === correctAnswers[currentQuestion];

                    choicesElem.src = "Assets/Images/Quiz Part/Choices/Active choice.png";

                    if (isCorrect) {
                        triggerScreenShake();
                        highlightCorrectSign(sign);
                        spawnYellowParticles(rect);

                        if (currentQuestion === 1) {
                            setDandelionDialogue(1);
                        } else if (currentQuestion === 2) {
                            setDandelionDialogue(2);
                        } else if (currentQuestion === 3) {
                            setDandelionDialogue(4);
                        }
                    } else {
                        hideDialogue(() => triggerGameOver());
                    }
                }
            });
        }

        function triggerGameOver() {
            isGameOver = true;
            clearAllObstacles();
            
            if (HittedBird) {
                answerKeyElem.src = `Assets/Images/Quiz Part/Answer Key/Try again bird.png`;
            } else {
                answerKeyElem.src = `Assets/Images/Quiz Part/Answer Key/Answer Key${currentQuestion}.png`;
            }

            gameOverOverlay.style.display = "flex";
            
            gameOverOverlayText.style.display = "none";
            requestAnimationFrame(() => {
                gameOverOverlayText.classList.add("fade-out");
                gameOverOverlayText.classList.remove("fade-in");
            });

            setTimeout(() => {
                gameOverOverlayText.classList.add("fade-in");
                gameOverOverlayText.classList.remove("fade-out");
                setTimeout(() => {
                    gameOverOverlayText.style.display = "flex";
                }, 300);
            }, 3000);
        }

        function triggerWin() {
            isWin = true;
            bdsfx.pause();
            clearAllObstacles();
            winOverlay.style.display = "flex";
        }

        function restartGame() {
            isGameOver = false;
            isWin = false;
            clearAllObstacles();

            if (currentQuestion == 3) {
                currentQuestion = 2;
                choicesElem.src = `Assets/Images/Quiz Part/Choices/choice2.png`;
            } else {
                currentQuestion = 1;
                choicesElem.src = `Assets/Images/Quiz Part/Choices/choice1.png`;
            }
            HittedBird = false;
            player.x = 50;
            player.y = 200;
            player.velX = 0;
            player.velY = 0;
            resetBoomerang();

            gameOverOverlay.style.display = "none";
            gameOverOverlayText.style.display = "none";
            gameOverOverlayText.classList.remove("fade-in", "fade-out");
            winOverlay.style.display = "none";

            currentDialogueIndex = 0;
            hideDialogue();
        }

        function updateBoomerang() {
            if (!boomerang.active) return;

            boomerang.timer++;

            if (boomerang.timer === boomerang.returnDelay) {
                boomerang.velX = -boomerang.velX;
            }

            boomerang.x += boomerang.velX;
            boomerang.rotation += 25;

            boomerangElem.style.transform = `translate(${boomerang.x}px, ${boomerang.y}px) rotate(${boomerang.rotation}deg)`;

            checkSignHits();

            const playerHitbox = {
                x: player.x,
                y: player.y,
                width: PLAYER_WIDTH,
                height: PLAYER_HEIGHT
            };

            const boomerangHitbox = {
                x: boomerang.x,
                y: boomerang.y,
                width: boomerang.width,
                height: boomerang.height
            };

            if (boomerang.timer > boomerang.returnDelay && isColliding(playerHitbox, boomerangHitbox)) {
                catchBoomerang();
                return;
            }

            if (boomerang.timer >= boomerang.maxLifetime) {
                resetBoomerang();
                triggerGameOver();
            }
        }

        function catchBoomerang() {
            resetBoomerang();
        }

        function isColliding(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        function getGroundYAt(feetX) {
            const normX = feetX / GAME_WIDTH;

            for (let i = 0; i < pathPoints.length - 1; i++) {
                const p1 = pathPoints[i];
                const p2 = pathPoints[i + 1];

                if (normX >= p1.x && normX <= p2.x) {
                    const t = (normX - p1.x) / (p2.x - p1.x || 1);
                    const normY = p1.y + t * (p2.y - p1.y);
                    return normY * GAME_HEIGHT;
                }
            }
            return GAME_HEIGHT;
        }

        function gameLoop() {
            if (!isGameOver && !isWin && !isDialogueActive && !isCutsceneActive && !isTutorialActive) {
                player.velX = 0;
                player.velY += player.gravity;

                player.x += player.velX;
                player.y += player.velY;

                if (player.x < -FEET_OFFSET_X + 20) player.x = -FEET_OFFSET_X + 20;
                if (player.x > GAME_WIDTH - FEET_OFFSET_X - 20) player.x = GAME_WIDTH - FEET_OFFSET_X - 20;

                const feetX = player.x + FEET_OFFSET_X;
                const targetGroundY = getGroundYAt(feetX) - PLAYER_HEIGHT;

                if (player.y >= targetGroundY) {
                    player.y = targetGroundY;
                    player.velY = 0;
                    player.isGrounded = true;
                    player.Jumped = 0;
                } else {
                    player.isGrounded = false;
                }

                updateBoomerang();
                updateSlidingObstacles(); 

                animationTimer++;
                if (animationTimer >= animationSpeed) {
                    animationTimer = 0;
                    currentFrameIndex = (currentFrameIndex + 1) % characterFrames.length;
                    playerElem.src = characterFrames[currentFrameIndex];
                }

                playerElem.style.transform = `translate(${player.x}px, ${player.y}px) scaleX(${player.facingDirection})`;
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
