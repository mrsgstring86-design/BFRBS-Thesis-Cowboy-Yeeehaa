<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Introduction Scene</title>
        <style>
            *{
              margin: 0;
              padding: 0;
              box-sizing: border-box;
              font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            }

            /* Outer Letterbox Container */
            body{
             display: flex;
             justify-content: center;
             align-items: center;
             height: 100vh;
             width: 100vw;
             background-color: #000000;
             overflow: hidden;
             animation: fadeInPage 0.5s ease-in-out forwards;
            }

            @keyframes fadeInPage {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            /* Fixed Game Box Wrapper */
            .Frame {
                position: absolute;
                width: 1920px;
                height: 1080px;
                background-color: #E55420;
                overflow: hidden;
                transform-origin: center center;
                display: flex;
                justify-content: center;
                align-items: center;
                transition: opacity 0.8s ease-in-out;
            }

            .Background{
                position: absolute;
                left: 0;
                bottom: 0;
                width: 100%;
                height: auto;
                align-items: center;
                justify-content: center;
                z-index: 1;
            }
            .dialouge-wrapper{
                display: flex;
                opacity: 1;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 100%;
                transition: opacity 0.8s linear;
                z-index: 5;
            }
            .dialouge{
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                object-position: center;
                position: relative;
                z-index: 2;
            }
            .DialougeWindow{
                position: absolute;
                inset: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 100%;
            }

            .dialogue-tint {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.6);
                z-index: 4;
                opacity: 1;
                pointer-events: none;
                transition: opacity 0.8s linear;
            }

            .character-wrapper{
                position: relative;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .character{
                position: absolute;
                z-index: 1;
                width: 40%;
                height: auto;
                bottom: 30%;
                left: 80%;
                transform: translateX(-50%);
                object-fit: contain;
                object-position: center;
            }
            @keyframes finger-press{
                0%, 25%{
                    transform: translate(0, 0);
                }
                50%, 65%{
                    transform: translate(0px, 150px);
                }
                90%, 100%{
                    transform: translate(0, 0);
                }
            }
            .Clouds{
                z-index: 1;
                position: absolute;
                width: 100%;
                bottom: 60px;
                animation: cloudSineMove 2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
                will-change: transform;
            }

            @keyframes cloudSineMove {
                0% {
                    transform: translateY(0px);
                }
                100% {
                    transform: translateY(40px);
                }
            }

            .fade-in-element {
                opacity: 1 !important;
            }

            .fade-out-element {
                opacity: 0 !important;
            }

            /* Fullscreen White Transition Overlay */
            .white-transition-overlay {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                background-color: #FFFFFF;
                z-index: 9999;
                opacity: 0;
                pointer-events: none;
                transition: opacity 1s ease-in-out;
            }

            .white-transition-overlay.active {
                opacity: 1;
                pointer-events: auto;
            }
        </style>
    </head>
    <body>

        <!-- Transition Overlay -->
        <div class="white-transition-overlay" id="whiteOverlay"></div>

        <div class="Frame" id="gameFrame">
            <div class="DialougeWindow">
                <img class="Clouds" src="Assets/Images/Bg 1/Bg1 Clouds.png">
                <img class="Background" src="Assets/Images/Bg 1/Bg1 Foreground.png">

                <div class="dialogue-tint"></div>

                <div class="dialouge-wrapper">
                    <div class="character-wrapper">
                        <img class="character" src="Assets/Images/Farmer/Farmer Wave.png">
                        <img class="dialouge" src="Assets/Images/Dialogue/TheEnd/P2 Dialogue1.png">
                    </div>
                </div> 
            </div>
        </div>

        <script>
            const GAME_WIDTH = 1920;
            const GAME_HEIGHT = 1080;
            const gameFrame = document.getElementById("gameFrame");
            const whiteOverlay = document.getElementById("whiteOverlay");

            function fitGameToWindow() {
                const scaleX = window.innerWidth / GAME_WIDTH;
                const scaleY = window.innerHeight / GAME_HEIGHT;
                const scale = Math.min(scaleX, scaleY);

                gameFrame.style.transform = `scale(${scale})`;
            }

            const dialouge = [
                "Wave", "Default", "Default", "Confuse", "Laugh", 
                "Default", "Default", "Default", "Default", "Default",
                "Default", "Default", "Serious", "Serious", "Serious", "Default"
            ];

            window.addEventListener("resize", fitGameToWindow);
            fitGameToWindow();

            let clicked = 1;
            let isReady = true;

            // Fades in the white background, redirects to index.html with fadeOut flag
            function transitionToIndexScene() {
                isReady = false;
                whiteOverlay.classList.add("active");

                setTimeout(() => {
                    window.location.href = "index.html?fadeOutWhite=true";
                }, 1000);
            }

            // Handles fading out the white overlay if returning from transition flag
            window.addEventListener("DOMContentLoaded", () => {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get("fadeOutWhite") === "true") {
                    whiteOverlay.classList.add("active");
                    setTimeout(() => {
                        whiteOverlay.classList.remove("active");
                    }, 50);
                }
            });

            document.addEventListener("keydown", (event) => {
                const key = event.key.toLowerCase();
                if (key === "z" || key === "x") {
                    if (isReady) {
                        clicked++;
                        updateDialogue();
                    }
                }
            });

            function updateDialogue() {
                if (clicked > dialouge.length) {
                    transitionToIndexScene();
                    return;
                }

                const characterElement = document.querySelector(".character");
                const dialougeElement = document.querySelector(".dialouge");

                if (dialougeElement) {
                    dialougeElement.src = `Assets/Images/Dialogue/TheEnd/P2 Dialogue${clicked}.png`;
                }

                if (characterElement && dialouge[clicked - 1]) {
                    characterElement.src = `Assets/Images/Farmer/Farmer ${dialouge[clicked - 1]}.png`;
                }
            }

            // Load initial dialogue state
            updateDialogue();
        </script>
    </body>
</html>
