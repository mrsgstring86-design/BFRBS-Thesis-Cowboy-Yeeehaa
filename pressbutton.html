<html lang="eng">
    <head>
        <title> Introduction Scene </title>
        <style>
            *{
              margin: 0;
              padding: 0;
              box-sizing: border-box;
              font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            }

            /* Outer Letterbox Container */
            body{
             display: flex;
             justify-content: center;
             align-items: center;
             height: 100vh;
             width: 100vw;
             background-color: #000000; /* Outer black background */
             overflow: hidden;
             animation: fadeInPage 0.5s ease-in-out forwards;
            }

            @keyframes fadeInPage {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            /* Fixed Game Box Wrapper to scale content dynamically */
            .Frame {
                position: absolute;
                width: 1920px;
                height: 1080px;
                background-color: #E55420; /* Inner game background */
                overflow: hidden;
                transform-origin: center center;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .Background{
                position: absolute;
                left: 0;
                bottom: 0;
                width: 100%;
                height: auto;
                align-items: center;
                justify-content: center;
                z-index: 1;
            }
            .dialouge-wrapper{
                display: flex;
                opacity: 0;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 100%;
                transition: opacity 0.8s linear;
                z-index: 5; /* Displays above the black tint */
            }
            .dialouge{
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                object-position: center;
                position: relative;
                z-index: 2;
            }
            .DialougeWindow{
                position: absolute;
                inset: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 100%;
                opacity: 0;
                transition: opacity 1.5s linear;
            }
            .DialougeWindow:has(.dialouge-wrapper.show) .Emergency-Alert {
                opacity: 0;
                pointer-events: none;
            }

            /* Black tint overlay behind character and dialogue */
            .dialogue-tint {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.6); /* Adjust opacity here */
                z-index: 4;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.8s linear;
            }
            .DialougeWindow:has(.dialouge-wrapper.show) .dialogue-tint {
                opacity: 1;
            }

            /* Wrapper bounds directly around the dialogue image */
            .character-wrapper{
                position: relative;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* Character positioned and sized directly relative to the dialogue frame container */
            .character{
                position: absolute;
                z-index: 1;
                width: 45%;            /* Scales proportionally with dialogue box */
                height: auto;
                bottom: 30%;           /* Fixed vertical position relative to dialogue bottom */
                left: 80%;             /* Centered horizontally relative to dialogue frame */
                transform: translateX(-50%);
                object-fit: contain;
                object-position: center;
            }

            .ClickWindow{
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: flex;
                opacity: 1;
                background-color: #431D16;
                justify-content: center;
                align-items: center;
                transition: opacity 1.5s linear;
                z-index: 10;
            }
            .ClickWindow.fade-out{
                opacity: 0;
                pointer-events: none;
            }
            .DialougeWindow.fade-in{
                opacity: 1;
            }
            .dialouge-wrapper.show{
                opacity: 1;
            }
            .Dont{
                width: 95%;
                position: absolute;
                display: flex;
                z-index: 2;
                flex: 1;
            }
            .First{
                width: 95%;
                position: absolute;
                display: flex;
                z-index: 0;
                flex: 1;
            }
            .Finger{
                z-index: 1;
                position: absolute;
                width: 132%;
                bottom: 26%;
                left: 65px;
                rotate: -135deg;
                animation: finger-press 2s ease-in-out infinite;
            }
            @keyframes finger-press{
                0%, 25%{
                    transform: translate(0, 0);
                }
                50%, 65%{
                    transform: translate(0px, 150px);
                }
                90%, 100%{
                    transform: translate(0, 0);
                }
            }
            .Clouds{
                z-index: 0;
                position: absolute;
                width: 100%;
                bottom: 60px;
                animation: cloudSineMove 2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
                will-change: transform;
            }
            .Emergency-Alert{
                z-index: 3;
                position: absolute;
                opacity: 0;
                width: 70%;
                transition: opacity 0.2s linear;
            }
            .Emergency-Alert.show{
                opacity: 1;
            }

            @keyframes cloudSineMove {
                0% {
                    transform: translateY(0px);
                }
                100% {
                    transform: translateY(40px);
                }
            }
        </style>
    </head>
    <body>

        <!-- Scaled Frame Container -->
        <div class="Frame" id="gameFrame">
            <div class="ClickWindow">
                <img class="Dont" src="Assets/Images/First page/Bfbrbs Don_t.png">
                <img class="Finger" src="Assets/Images/First page/Bfrbs Finger.png">
                <img class="First" src="Assets/Images/First page/Bfrbs First Page.png">
            </div>
            <div class="DialougeWindow">
                <audio class="Warn-Sound" src="Assets/Sounds/warningsound.mp3" loop></audio>
                <img class="Emergency-Alert" src="Assets/Images/Bg 1/Emergency Alert.png">
                <img class="Clouds" src="Assets/Images/Bg 1/Bg1 Clouds.png">
                <img class="Background" src="Assets/Images/Bg 1/Bg1 Foreground.png">
                
                <!-- Dark Overlay Tint -->
                <div class="dialogue-tint"></div>

                <div class="dialouge-wrapper">
                    <div class="character-wrapper">
                        <img class="character" src="Assets/Images/Farmer/Farmer Fight.png">
                        <img class="dialouge" src="Assets/Images/Dialogue/Part 1/Part 1/1-P1Dialogue.png">
                    </div>
                </div> 
            </div>
        </div>

        <script>
            localStorage.setItem("Npc1Completed", "false");
            localStorage.setItem("Npc2Completed", "false");
            localStorage.setItem("Npc3Completed", "false");
            
            const GAME_WIDTH = 1920;
            const GAME_HEIGHT = 1080;
            const gameFrame = document.getElementById("gameFrame");

            function fitGameToWindow() {
                const scaleX = window.innerWidth / GAME_WIDTH;
                const scaleY = window.innerHeight / GAME_HEIGHT;
                const scale = Math.min(scaleX, scaleY);

                gameFrame.style.transform = `scale(${scale})`;
            }

            window.addEventListener("resize", fitGameToWindow);
            fitGameToWindow();

            let clicked = 0;
            let isReady = false; // Flag to prevent dialogue advancement during sequence timing

            const dialouge = [
                "Fight", "Fight", "Confuse with weapon", "Angry", "Headache", 
                "Default", "Default", "Default", "Headache", "Headache", 
                "Default", "Default", "Default", "Default", "Default"
            ];

            document.addEventListener("keydown", (event) => {
                if (event.key.toLowerCase() === "z" || event.key.toLowerCase() === "x") {
                    
                    // 1. Initial trigger sequence
                    if (clicked === 0) {
                        clicked = 1;

                        document.querySelector(".ClickWindow").classList.add("fade-out");
                        const dialougeWindow = document.querySelector(".DialougeWindow");
                        const emergencyAlert = document.querySelector(".Emergency-Alert");
                        const dialougeWrapper = document.querySelector(".dialouge-wrapper");
                        const warnsfx = document.querySelector(".Warn-Sound");

                        dialougeWindow.classList.add("fade-in");
                        
                        setTimeout(() => {
                            emergencyAlert.classList.add("show"); 
                            warnsfx.play();
                        }, 4500);

                        setTimeout(() => {
                            dialougeWrapper.classList.add("show");
                            warnsfx.pause();
                            warnsfx.currentTime = 0;
                            isReady = true; // Unlock dialogue cycling once window is visible
                            
                            // Load first dialogue image
                            updateDialogue();
                        }, 7550);

                        return; // Exit early during initial setup
                    }

                    // 2. Advance dialogue only after sequence finishes
                    if (isReady) {
                        clicked++;
                        updateDialogue();
                    }
                }
            });

            function updateDialogue() {
                const dialougeWrapper = document.querySelector(".dialouge-wrapper");

                if (dialougeWrapper && dialougeWrapper.classList.contains("show")) {
                    const characterElement = document.querySelector(".character");
                    const dialougeElement = document.querySelector(".dialouge");

                    if (clicked <= 15) {
                        dialougeElement.src = `Assets/Images/Dialogue/Part 1/Part 1/${clicked}-P1Dialogue.png`;
                        
                        if (dialouge[clicked - 1]) { 
                            characterElement.src = `Assets/Images/Farmer/Farmer ${dialouge[clicked - 1]}.png`;
                        }
                    } else {
                        localStorage.setItem("dialogueCompleted", "true");

                        const overlay = document.querySelector(".page-transition-overlay");
                        if (overlay) {
                            overlay.classList.add("fade-out");
                        }

                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 500);
                    }
                }
            }
        </script>
    </body>
</html>
