<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Introduction Scene</title>
        <style>
            *{
              margin: 0;
              padding: 0;
              box-sizing: border-box;
              font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            }

            /* Outer Letterbox Container */
            body{
             display: flex;
             justify-content: center;
             align-items: center;
             height: 100vh;
             width: 100vw;
             background-color: #000000;
             overflow: hidden;
             animation: fadeInPage 0.5s ease-in-out forwards;
            }

            @keyframes fadeInPage {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            /* Fixed Game Box Wrapper */
            .Frame {
                position: absolute;
                width: 1920px;
                height: 1080px;
                background-color: #E55420;
                overflow: hidden;
                transform-origin: center center;
                display: flex;
                justify-content: center;
                align-items: center;
                transition: opacity 0.8s ease-in-out;
            }
            .ClickBG{
                width: 100%;
                position: absolute;
                display: flex;
                z-index: 1;
                flex: 1;
            }
            .Logo{
                width: 13%;
                position: absolute;
                z-index: 2;
                left: 0;
                top: 0;
                will-change: transform;
            }
            .Background{
                position: absolute;
                left: 0;
                bottom: 0;
                width: 100%;
                height: auto;
                align-items: center;
                justify-content: center;
                z-index: 1;
            }
            .dialouge-wrapper{
                display: flex;
                opacity: 0;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 100%;
                transition: opacity 0.8s linear;
                z-index: 5;
            }
            .dialouge{
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                object-position: center;
                position: relative;
                z-index: 2;
            }
            .DialougeWindow{
                position: absolute;
                inset: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 100%;
                opacity: 0;
                transition: opacity 1.5s linear;
            }
            .DialougeWindow:has(.dialouge-wrapper.show) .Emergency-Alert {
                opacity: 0;
                pointer-events: none;
            }

            .dialogue-tint {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.6);
                z-index: 4;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.8s linear;
            }
            .DialougeWindow:has(.dialouge-wrapper.show) .dialogue-tint {
                opacity: 1;
            }

            .character-wrapper{
                position: relative;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .character{
                position: absolute;
                z-index: 1;
                width: 40%;
                height: auto;
                bottom: 30%;
                left: 80%;
                transform: translateX(-50%);
                object-fit: contain;
                object-position: center;
            }

            .ClickWindow{
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: flex;
                opacity: 1;
                background-color: #431D16;
                justify-content: center;
                align-items: center;
                transition: opacity 1.5s linear;
                z-index: 10;
            }
            .ClickWindow.fade-out{
                opacity: 0;
                pointer-events: none;
            }
            .DialougeWindow.fade-in{
                opacity: 1;
            }
            .dialouge-wrapper.show{
                opacity: 1;
            }
            @keyframes finger-press{
                0%, 25%{
                    transform: translate(0, 0);
                }
                50%, 65%{
                    transform: translate(0px, 150px);
                }
                90%, 100%{
                    transform: translate(0, 0);
                }
            }
            .Clouds{
                z-index: 1;
                position: absolute;
                width: 100%;
                bottom: 60px;
                animation: cloudSineMove 2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
                will-change: transform;
            }
            .Emergency-Alert{
                z-index: 3;
                position: absolute;
                opacity: 0;
                width: 70%;
                transition: opacity 0.2s linear;
            }
            .Emergency-Alert.show{
                opacity: 1;
            }

            @keyframes cloudSineMove {
                0% {
                    transform: translateY(0px);
                }
                100% {
                    transform: translateY(40px);
                }
            }

            /* Education Window Styling */
            .EducationWindow {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                opacity: 0;
                pointer-events: none;
                transition: opacity 1.8s ease-in-out;
                z-index: 20;
            }

            .EducationWindow.show {
                opacity: 1;
                pointer-events: auto;
            }

            .Part1, .Part2, .Part3, .Part4 {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                transition: opacity 1.8s ease-in-out;
            }

            .Part2, .Part3, .Part4 {
                display: none;
                opacity: 0;
            }

            .Part1 img, .Part2 img, .Part3 img, .Part4 img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                object-position: center;
            }

            .Edu_Background{
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                z-index: 0;
            }
            
            .Part1 .Star1, .Part2 .Star1 {
                position: absolute;
                top: 6%;
                left: 23%;
                width: 6.5%;
                height: auto;
                z-index: 1;
                opacity: 0;
                transition: opacity 1.8s ease-in-out, top 1.8s ease-in-out, left 1.8s ease-in-out, right 1.8s ease-in-out, bottom 1.8s ease-in-out;
            }

            .Part1 .Star1 img, .Part2 .Star1 img {
                width: 100%;
                height: auto;
                animation: rotateStar 10s linear infinite;
                transform-origin: center center;
            }

            .Part1 .Star2, .Part2 .Star2 {
                position: absolute;
                top: 6%;
                right: 23%;
                width: 6.5%;
                height: auto;
                z-index: 1;
                opacity: 0;
                transition: opacity 1.8s ease-in-out, top 1.8s ease-in-out, left 1.8s ease-in-out, right 1.8s ease-in-out, bottom 1.8s ease-in-out;
            }

            .Part1 .Star2 img, .Part2 .Star2 img {
                width: 100%;
                height: auto;
                animation: rotateStar 10s linear infinite;
                transform-origin: center center;
            }

            @keyframes rotateStar {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            .Part1 .Trang,
            .Part1 .Text1, .Part1 .Text2, .Part1 .Picture1,
            .Part1 .Text3, .Part1 .Picture2, .Part1 .Text4,
            .Part1 .Picture3, .Part1 .Text5, .Part1 .Text6,
            .Part2 .Trang,
            .Part2 .Text1, .Part2 .Text2, .Part2 .Picture1,
            .Part2 .Text3, .Part2 .Picture2, .Part2 .Text4,
            .Part2 .Picture3, .Part2 .Text5,
            .Part3 .Circle, .Part3 .Head,
            .Part3 .Sub1, .Part3 .Sub2, .Part3 .Sub3, .Part3 .Sub4,
            .Part3 .Text1, .Part3 .Text2, .Part3 .Text3, .Part3 .Text4, .Part3 .Text5,
            .Part4 .Text1, .Part4 .Text2, .Part4 .Text3 {
                opacity: 0;
                transition: opacity 1.2s ease-in-out;
            }

            /* Fast transition class for Circle & Head to appear rapidly */
            .Part3 .Circle.fast-transition, 
            .Part3 .Head.fast-transition {
                transition: opacity 0.4s ease-in-out !important;
            }

            .Trang      { z-index: 2; }
            .Picture1   { z-index: 2; }
            .Picture2   { z-index: 2; }
            .Picture3   { z-index: 2; }
            .Text1      { z-index: 3; }
            .Text2      { z-index: 3; }
            .Text3      { z-index: 3; }
            .Text4      { z-index: 3; }
            .Text5      { z-index: 3; }

            .fade-in-element {
                opacity: 1 !important;
            }

            .fade-out-element {
                opacity: 0 !important;
            }
        </style>
    </head>
    <body>

                <div class="Part4">

            <div class="DialougeWindow">
                <audio class="Warn-Sound" src="Assets/Sounds/warningsound.mp3" loop></audio>
                <img class="Emergency-Alert" src="Assets/Images/Bg 1/Emergency Alert.png">
                <img class="Clouds" src="Assets/Images/Bg 1/Bg1 Clouds.png">

                <div class="dialogue-tint"></div>

                <div class="dialouge-wrapper">
                    <div class="character-wrapper">
                        <img class="character" src="Assets/Images/Farmer/Farmer Fight.png">

        <script>
            localStorage.setItem("Npc1Completed", "false");
            localStorage.setItem("Npc2Completed", "false");
            localStorage.setItem("Npc3Completed", "false");

            const bgsfx = document.querySelector(".BG-Sound");
            const naturalsfx = document.querySelector(".Natural-Sound");
            const ADSFX = document.querySelector(".ADS");
            const diamondsfx = document.querySelector(".DSFX");

            // Play background music immediately on page load
            function playBackgroundMusic() {
                if (bgsfx) {
                    const playPromise = bgsfx.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => {
                            // If blocked by browser autoplay policy, retry on user interaction
                            const enableAudio = () => {
                                bgsfx.play();
                                window.removeEventListener("click", enableAudio);
                                window.removeEventListener("keydown", enableAudio);
                            };
                            window.addEventListener("click", enableAudio);
                            window.addEventListener("keydown", enableAudio);
                        });
                    }
                }
            }
            playBackgroundMusic();

            const GAME_WIDTH = 1920;
            const GAME_HEIGHT = 1080;
            const gameFrame = document.getElementById("gameFrame");

            function fitGameToWindow() {
                const scaleX = window.innerWidth / GAME_WIDTH;
                const scaleY = window.innerHeight / GAME_HEIGHT;
                const scale = Math.min(scaleX, scaleY);

                gameFrame.style.transform = `scale(${scale})`;
            }

            window.addEventListener("resize", fitGameToWindow);
            fitGameToWindow();

            // Logo Bouncing Physics Implementation
            const logoElem = document.getElementById("bouncingLogo");
            let logoX = Math.random() * (GAME_WIDTH - 250);
            let logoY = Math.random() * (GAME_HEIGHT - 250);
            let logoVx = 4;
            let logoVy = 4;
            let bounceAnimId = null;

            function animateBouncingLogo() {
                const logoWidth = logoElem.offsetWidth || 250;
                const logoHeight = logoElem.offsetHeight || 150;

                logoX += logoVx;
                logoY += logoVy;

                if (logoX <= 0) {
                    logoX = 0;
                    logoVx = Math.abs(logoVx);
                } else if (logoX + logoWidth >= GAME_WIDTH) {
                    logoX = GAME_WIDTH - logoWidth;
                    logoVx = -Math.abs(logoVx);
                }

                if (logoY <= 0) {
                    logoY = 0;
                    logoVy = Math.abs(logoVy);
                } else if (logoY + logoHeight >= GAME_HEIGHT) {
                    logoY = GAME_HEIGHT - logoHeight;
                    logoVy = -Math.abs(logoVy);
                }

                logoElem.style.transform = `translate(${logoX}px, ${logoY}px)`;
                bounceAnimId = requestAnimationFrame(animateBouncingLogo);
            }

            bounceAnimId = requestAnimationFrame(animateBouncingLogo);

            let clicked = 0;
            let isReady = false; 
            
            let currentEduPart = 0; 
            let eduStep = 0; 
            let canAdvanceEduPart = false;
            let sequenceTimeout = null;

            let bfrbsFrame = 1;
            let bfrbsInterval = null;

            // Exactly 16 Dialogue Entries
            const dialouge = [
                "Fight", "Fight", "Confuse with weapon", "Angry", "Headache", 
                "Default", "Default", "Default", "Headache", "Headache", 
                "Default", "Default", "Default", "Default", "Default", "Default"
            ];

            const starPositions = [
                // Part 1
                [{ star1: { top: "10%", left: "25%", width: "7%" }, star2: { top: "10%", right: "27%", width: "7%" } },
                { star1: { top: "22%", left: "25%", width: "6%" }, star2: { top: "22%", right: "25%", width: "6%" } },
                { star1: { top: "27%", left: "12%", width: "5%" }, star2: { top: "27%", right: "12%", width: "5%" } },
                { star1: { bottom: "42%", left: "3%", width: "6%" }, star2: { bottom: "42%", right: "3%", width: "6%" } },
                { star1: { bottom: "42%", left: "3%", width: "6%" }, star2: { bottom: "42%", right: "3%", width: "6%" } },
                { star1: { bottom: "42%", left: "3%", width: "6%" }, star2: { bottom: "42%", right: "3%", width: "6%" } },
                { star1: { bottom: "42%", left: "3%", width: "6%" }, star2: { bottom: "42%", right: "3%", width: "6%" } },
                { star1: { bottom: "42%", left: "3%", width: "6%" }, star2: { bottom: "42%", right: "3%", width: "6%" } },
                { star1: { bottom: "42%", left: "3%", width: "6%" }, star2: { bottom: "42%", right: "3%", width: "6%" } }],
                // Part 2
                [{ star1: { top: "5%", left: "5%", width: "7%" }, star2: { top: "5%", right: "5%", width: "7%" } },
                { star1: { bottom: "40%", left: "3%", width: "6%" }, star2: { bottom: "40%", right: "3%", width: "6%" } },
                { star1: { bottom: "40%", left: "3%", width: "6%" }, star2: { bottom: "40%", right: "3%", width: "6%" } },
                { star1: { bottom: "40%", left: "3%", width: "6%" }, star2: { bottom: "40%", right: "3%", width: "6%" } },
                { star1: { bottom: "40%", left: "3%", width: "6%" }, star2: { bottom: "40%", right: "3%", width: "6%" } },
                { star1: { bottom: "40%", left: "3%", width: "6%" }, star2: { bottom: "40%", right: "3%", width: "6%" } },
                { star1: { bottom: "40%", left: "3%", width: "6%" }, star2: { bottom: "40%", right: "3%", width: "6%" } },
                { star1: { bottom: "40%", left: "3%", width: "6%" }, star2: { bottom: "40%", right: "3%", width: "6%" } },
                { star1: { bottom: "40%", left: "3%", width: "6%" }, star2: { bottom: "40%", right: "3%", width: "6%" } }]
            ];

            function startBfrbsAnimation(partContainer) {
                const trangElement = document.querySelector(`${partContainer} .Trang`);
                if (!trangElement) return;

                if (bfrbsInterval) clearInterval(bfrbsInterval);

                if (currentEduPart === 1) {
                    bfrbsFrame = 1;
                    bfrbsInterval = setInterval(() => {
                        bfrbsFrame = (bfrbsFrame % 3) + 1;
                        trangElement.src = `Assets/Images/Explanation_Part/explain1/Bfrbs${bfrbsFrame}.png`;
                    }, 250);
                }
            }

            function positionStars(partContainer, index, step) {
                if (partContainer === ".Part3" || partContainer === ".Part4" || !starPositions[index]) return;

                const star1 = document.querySelector(`${partContainer} .Star1`);
                const star2 = document.querySelector(`${partContainer} .Star2`);
                const pos = starPositions[index][step];

                if (!pos || !star1 || !star2) return;

                star1.style.top = pos.star1.top || "auto";
                star1.style.bottom = pos.star1.bottom || "auto";
                star1.style.left = pos.star1.left || "auto";
                star1.style.right = pos.star1.right || "auto";
                star1.style.width = pos.star1.width || "7%";

                star2.style.top = pos.star2.top || "auto";
                star2.style.bottom = pos.star2.bottom || "auto";
                star2.style.left = pos.star2.left || "auto";
                star2.style.right = pos.star2.right || "auto";
                star2.style.width = pos.star2.width || "7%";

                star1.classList.add("fade-in-element");
                star2.classList.add("fade-in-element");
            }

            function skipEducationSequence(partNumber) {
                if (sequenceTimeout) clearTimeout(sequenceTimeout);
                const partContainer = `.Part${partNumber}`;
                const elements = document.querySelectorAll(`${partContainer} img, ${partContainer} div`);
                
                if (partNumber === 2) {
                    const pic1 = document.querySelector(".Part2 .Picture1");
                    const pic2 = document.querySelector(".Part2 .Picture2");
                    const pic3 = document.querySelector(".Part2 .Picture3");
                    if (pic1) pic1.src = "Assets/Images/Explanation_Part/explain2/Pic2.1 active.png";
                    if (pic2) pic2.src = "Assets/Images/Explanation_Part/explain2/Pic2.2 active.png";
                    if (pic3) pic3.src = "Assets/Images/Explanation_Part/explain2/Pic2.3 active.png";
                }

                elements.forEach(el => {
                    el.classList.remove("fade-out-element");
                    el.classList.add("fade-in-element");
                });

                if (partNumber === 3) {
                    const finalSub = document.querySelector(".Part3 .Sub4");
                    const finalText = document.querySelector(".Part3 .Text5");
                    if (finalSub) finalSub.classList.add("fade-in-element");
                    if (finalText) finalText.classList.add("fade-in-element");
                }

                canAdvanceEduPart = true;
            }

            function playEducationSequence(partNumber) {
                currentEduPart = partNumber;
                canAdvanceEduPart = false;
                const partContainer = `.Part${partNumber}`;

                const sequence = [
                    // Part 1 Sequence
                    [
                        { show: [`${partContainer} .Trang`], duration: 2000 },
                        { show: [`${partContainer} .Text1`], duration: 2000 },
                        { show: [`${partContainer} .Text2`], duration: 2000 },
                        { show: [`${partContainer} .Picture1`], duration: 2000 },
                        { show: [`${partContainer} .Text3`], duration: 2000 },
                        { show: [`${partContainer} .Picture2`], duration: 2000 },
                        { show: [`${partContainer} .Text4`], duration: 2000 },
                        { show: [`${partContainer} .Picture3`], duration: 2000 },
                        { show: [`${partContainer} .Text5`], duration: 2000 },
                        { show: [`${partContainer} .Text6`], duration: 2000 }
                    ],
                    // Part 2 Sequence
                    [
                        { show: [`${partContainer} .Trang`], duration: 2000 },
                        { show: [`${partContainer} .Picture1`], duration: 2000 },
                        { show: [`${partContainer} .Text1`], duration: 2000 },
                        { show: [`${partContainer} .Picture2`], duration: 2000 },
                        { show: [`${partContainer} .Text2`], duration: 2000 },
                        { show: [`${partContainer} .Picture3`], duration: 2000 },
                        { show: [`${partContainer} .Text3`], duration: 2000 },
                        `Orange All`,
                        { show: [`${partContainer} .Text4`], duration: 2000 },
                    ],
                    // Part 3 Sequence
                    [
                        /* Step 0: Circle and Head appear fast together */
                        { show: [`${partContainer} .Circle`, `${partContainer} .Head`], duration: 400 },

                        /* Step 1: Sub1 appears immediately */
                        { show: [`${partContainer} .Sub1`], duration: 1000 },

                        /* Step 2: Text1 appears; delay added so people can read it */
                        { show: [`${partContainer} .Text1`], duration: 2000 },

                        /* Step 3: Text1 fades out, Sub2 appears immediately without hiding Sub1 */
                        { hide: [`${partContainer} .Text1`], show: [`${partContainer} .Sub2`], duration: 1000 },

                        /* Step 4: Text2 appears; delay added for reading */
                        { show: [`${partContainer} .Text2`], duration: 2000 },

                        /* Step 5: Text2 fades out, Sub3 appears immediately */
                        { hide: [`${partContainer} .Text2`], show: [`${partContainer} .Sub3`], duration: 1000 },

                        /* Step 6: Text3 appears; delay added for reading */
                        { show: [`${partContainer} .Text3`], duration: 5000 },

                        /* Step 7: Text3 fades out, Sub4 appears immediately */
                        { hide: [`${partContainer} .Text3`], show: [`${partContainer} .Sub4`], duration: 1000 },

                        /* Step 8: Text4 appears; delay added for reading */
                        { show: [`${partContainer} .Text4`], duration: 5000 },

                        /* Step 9: Text4 fades out, Text5 appears at the end */
                        { hide: [`${partContainer} .Text4`], show: [`${partContainer} .Text5`], duration: 5000 }
                    ],
                    // Part 4 Sequence
                    [
                        { show: [`${partContainer} .Text1`] },
                        { show: [`${partContainer} .Text2`] },
                        { show: [`${partContainer} .Text3`] }
                    ]
                ];

                const partIndex = partNumber - 1; 
                const currentPartSequence = sequence[partIndex];

                if (currentPartSequence && eduStep < currentPartSequence.length) {
                    const stepItem = currentPartSequence[eduStep];

                    if (typeof stepItem === "object") {
                        if (stepItem.hide) {
                            stepItem.hide.forEach(selector => {
                                const el = document.querySelector(selector);
                                if (el) {
                                    el.classList.remove("fade-in-element");
                                    el.classList.add("fade-out-element");
                                }
                            });
                        }

                        let delay = 0;
                        setTimeout(() => {
                            if (stepItem.show) {
                                stepItem.show.forEach(selector => {
                                    const el = document.querySelector(selector);
                                    if (el) {
                                        el.classList.remove("fade-out-element");
                                        el.classList.add("fade-in-element");
                                    }
                                });
                            }
                        }, delay);
                    } else if (stepItem === "Orange All") {
                        const pic1 = document.querySelector(`${partContainer} .Picture1`);
                        const pic2 = document.querySelector(`${partContainer} .Picture2`);
                        const pic3 = document.querySelector(`${partContainer} .Picture3`);

                        if (pic1) pic1.src = "Assets/Images/Explanation_Part/explain2/Pic2.1 active.png";
                        if (pic2) pic2.src = "Assets/Images/Explanation_Part/explain2/Pic2.2 active.png";
                        if (pic3) pic3.src = "Assets/Images/Explanation_Part/explain2/Pic2.3 active.png";
                    } else {
                        const el = document.querySelector(stepItem);
                        if (el) el.classList.add("fade-in-element");
                    }

                    if (eduStep === 0) {
                        startBfrbsAnimation(partContainer);
                    }

                    positionStars(partContainer, partIndex, eduStep);

                    let stepDuration = (typeof stepItem === "object" && stepItem.duration) ? stepItem.duration : 3500;
                    eduStep++;

                    sequenceTimeout = setTimeout(() => playEducationSequence(partNumber), stepDuration); 
                } else {
                    canAdvanceEduPart = true;
                }
            }

            function transitionToPart2() {
                if (bfrbsInterval) clearInterval(bfrbsInterval);
                if (sequenceTimeout) clearTimeout(sequenceTimeout);

                const part1 = document.querySelector(".Part1");
                const part2 = document.querySelector(".Part2");

                canAdvanceEduPart = false;
                part1.style.opacity = "0";

                setTimeout(() => {
                    part1.style.display = "none";
                    part2.style.display = "block";

                    setTimeout(() => {
                        part2.style.opacity = "1";
                        eduStep = 0;
                        playEducationSequence(2);
                    }, 50);
                }, 800);
            }

            function transitionToPart3() {
                if (bfrbsInterval) clearInterval(bfrbsInterval);
                if (sequenceTimeout) clearTimeout(sequenceTimeout);

                const part2 = document.querySelector(".Part2");
                const part3 = document.querySelector(".Part3");

                canAdvanceEduPart = false;
                part2.style.opacity = "0";

                setTimeout(() => {
                    part2.style.display = "none";
                    part3.style.display = "block";

                    setTimeout(() => {
                        part3.style.opacity = "1";
                        eduStep = 0;
                        playEducationSequence(3);
                    }, 50);
                }, 800);
            }

            function transitionToPart4() {
                if (bfrbsInterval) clearInterval(bfrbsInterval);
                if (sequenceTimeout) clearTimeout(sequenceTimeout);

                const part3 = document.querySelector(".Part3");
                const part4 = document.querySelector(".Part4");

                canAdvanceEduPart = false;
                part3.style.opacity = "0";

                setTimeout(() => {
                    part3.style.display = "none";
                    part4.style.display = "block";

                    setTimeout(() => {
                        part4.style.opacity = "1";
                        eduStep = 0;
                        playEducationSequence(4);
                    }, 50);
                }, 800);
            }

            function finishEducationAndShowDialogue15() {
                if (bfrbsInterval) clearInterval(bfrbsInterval);
                if (sequenceTimeout) clearTimeout(sequenceTimeout);

                const educationWindow = document.querySelector(".EducationWindow");
                const dialougeWrapper = document.querySelector(".dialouge-wrapper");

                if (diamondsfx) {
                    diamondsfx.pause();
                    diamondsfx.currentTime = 0;
                }

                educationWindow.classList.remove("show");
                currentEduPart = 0;

                setTimeout(() => {
                    dialougeWrapper.style.opacity = "1";
                    dialougeWrapper.classList.add("show");
                    clicked = 15;
                    updateDialogue();
                    isReady = true;
                }, 800);
            }

            function goToMapScene() {
                isReady = false;
                if (ADSFX) {
                    ADSFX.pause();
                    ADSFX.currentTime = 0;
                }
                if (diamondsfx) {
                    diamondsfx.pause();
                    diamondsfx.currentTime = 0;
                }
                const gameFrame = document.getElementById("gameFrame");
                gameFrame.style.opacity = "0";

                setTimeout(() => {
                    window.location.href = "map.html";
                }, 800);
            }

            document.addEventListener("keydown", (event) => {
                if (event.key.toLowerCase() === "z" || event.key.toLowerCase() === "x") {
                    bgsfx.pause();
                    if (clicked === 0) {
                        clicked = 1;

                        if (bounceAnimId) cancelAnimationFrame(bounceAnimId);

                        document.querySelector(".ClickWindow").classList.add("fade-out");
                        const dialougeWindow = document.querySelector(".DialougeWindow");
                        const emergencyAlert = document.querySelector(".Emergency-Alert");
                        const dialougeWrapper = document.querySelector(".dialouge-wrapper");
                        const warnsfx = document.querySelector(".Warn-Sound");

                        dialougeWindow.classList.add("fade-in");

                        naturalsfx.play();
                        
                        setTimeout(() => {
                            naturalsfx.pause();
                            emergencyAlert.classList.add("show"); 
                            warnsfx.play();
                        }, 4500);

                        setTimeout(() => {
                            dialougeWrapper.classList.add("show");
                            warnsfx.pause();
                            warnsfx.currentTime = 0;
                            isReady = true; 
                            updateDialogue();
                        }, 7550);

                        return;
                    }

                    if (currentEduPart === 1) {
                        if (canAdvanceEduPart) {
                            transitionToPart2();
                        } else {
                            skipEducationSequence(1);
                        }
                        return;
                    }

                    if (currentEduPart === 2) {
                        if (canAdvanceEduPart) {
                            transitionToPart3();
                        } else {
                            skipEducationSequence(2);
                        }
                        return;
                    }

                    if (currentEduPart === 3) {
                        if (canAdvanceEduPart) {
                            transitionToPart4();
                        }
                        return;
                    }

                    if (currentEduPart === 4) {
                        if (canAdvanceEduPart) {
                            finishEducationAndShowDialogue15();
                        } else {
                            skipEducationSequence(4);
                        }
                        return;
                    }

                    // Advances dialogue or redirects to map.html after Dialogue 16
                    if (isReady && currentEduPart === 0) {
                        if (clicked >= dialouge.length) {
                            goToMapScene();
                        } else {
                            clicked++;
                            updateDialogue();
                        }
                    }
                }
            });

            function updateDialogue() {
                const dialougeWrapper = document.querySelector(".dialouge-wrapper");

                if (dialougeWrapper && dialougeWrapper.classList.contains("show")) {
                    const characterElement = document.querySelector(".character");
                    const dialougeElement = document.querySelector(".dialouge");

                    // Trigger ADSFX playback on Dialogue 4
                    if (clicked === 4 && ADSFX) {
                        ADSFX.play().catch(e => console.log("ADSFX play deferred:", e));
                    }

                    if (clicked <= 14) {
                        dialougeElement.src = `Assets/Images/Dialogue/Part 1/Part 1/${clicked}-P1Dialogue.png`;
                        
                        if (dialouge[clicked - 1]) { 
                            characterElement.src = `Assets/Images/Farmer/Farmer ${dialouge[clicked - 1]}.png`;
                        }
                    } else if (clicked === 14.5) { 
                        if (ADSFX) {
                            ADSFX.pause();
                            ADSFX.currentTime = 0;
                        }
                        if (diamondsfx) {
                            diamondsfx.play().catch(e => console.log("DiamondsFX play deferred:", e));
                        }
                    } else if (clicked >= 15) {
                        if (diamondsfx) {
                            diamondsfx.pause();
                            diamondsfx.currentTime = 0;
                        }
                        dialougeElement.src = `Assets/Images/Dialogue/Part 1/Part 1/${clicked}-P1Dialogue.png`;
                        
                        if (dialouge[clicked - 1]) {
                            characterElement.src = `Assets/Images/Farmer/Farmer ${dialouge[clicked - 1]}.png`;
                        } else {
                            characterElement.src = `Assets/Images/Farmer/Farmer Default.png`;
                        }
                    }
                }
            }

            const originalUpdateDialogue = updateDialogue;
            updateDialogue = function() {
                const dialougeWrapper = document.querySelector(".dialouge-wrapper");
                const educationWindow = document.querySelector(".EducationWindow");

                if (clicked === 15 && currentEduPart === 0 && eduStep === 0) {
                    clicked = 14.5;
                    if (ADSFX) {
                        ADSFX.pause();
                        ADSFX.currentTime = 0;
                    }
                    if (diamondsfx) {
                        diamondsfx.play().catch(e => console.log("DiamondsFX play deferred:", e));
                    }
                    dialougeWrapper.style.opacity = "0"; 
                    educationWindow.classList.add("show"); 
                    isReady = false; 

                    setTimeout(() => {
                        eduStep = 0;
                        playEducationSequence(1);
                    }, 500);
                    return;
                }

                originalUpdateDialogue();
            };
        </script>
    </body>
</html>
