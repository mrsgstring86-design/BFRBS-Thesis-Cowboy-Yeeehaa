<html lang="eng">
    <head>
        <title> Introduction Scene </title>
        <style>
            *{
              margin: 0;
              padding: 0;
              box-sizing: border-box;
              font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            }

            /* Outer Letterbox Container */
            body{
             display: flex;
             justify-content: center;
             align-items: center;
             height: 100vh;
             width: 100vw;
             background-color: #000000; /* Outer black background */
             overflow: hidden;
             animation: fadeInPage 0.5s ease-in-out forwards;
            }

            @keyframes fadeInPage {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            /* Fixed Game Box Wrapper to scale content dynamically */
            .Frame {
                position: absolute;
                width: 1920px;
                height: 1080px;
                background-color: #E55420; /* Inner game background */
                overflow: hidden;
                transform-origin: center center;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .Background{
                position: absolute;
                left: 0;
                bottom: 0;
                width: 100%;
                height: auto;
                align-items: center;
                justify-content: center;
                z-index: -2;
            }
            .dialouge-wrapper{
                display: flex;
                opacity: 0;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 100%;
                transition: opacity 0.8s linear;
            }
            .dialouge{
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                object-position: center;
                position: relative;
                z-index: 2;
            }
            .DialougeWindow{
                position: absolute;
                inset: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 100%;
                opacity: 0;
                transition: opacity 1.5s linear;
            }
            .DialougeWindow:has(.dialouge-wrapper.show) .Emergency-Alert {
                opacity: 0;
                pointer-events: none;
            }

            /* Wrapper bounds directly around the dialogue image */
            .character-wrapper{
                position: relative;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            /* Character positioned and sized directly relative to the dialogue frame container */
            .character{
                position: absolute;
                z-index: 1;
                width: 45%;            /* Scales proportionally with dialogue box */
                height: auto;
                bottom: 30%;           /* Fixed vertical position relative to dialogue bottom */
                left: 80%;             /* Centered horizontally relative to dialogue frame */
                transform: translateX(-50%);
                object-fit: contain;
                object-position: center;
            }

            .ClickWindow{
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: flex;
                opacity: 1;
                background-color: #431D16;
                justify-content: center;
                align-items: center;
                transition: opacity 1.5s linear;
                z-index: 10;
            }
            .ClickWindow.fade-out{
                opacity: 0;
                pointer-events: none;
            }
            .DialougeWindow.fade-in{
                opacity: 1;
            }
            .dialouge-wrapper.show{
                opacity: 1;
            }
            .Dont{
                width: 95%;
                position: absolute;
                display: flex;
                z-index: 2;
                flex: 1;
            }
            .First{
                width: 95%;
                position: absolute;
                display: flex;
                z-index: 0;
                flex: 1;
            }
            .Finger{
                z-index: 1;
                position: absolute;
                width: 132%;
                bottom: 26%;
                left: 65px;
                rotate: -135deg;
                animation: finger-press 2s ease-in-out infinite;
            }
            @keyframes finger-press{
                0%, 25%{
                    transform: translate(0, 0);
                }
                50%, 65%{
                    transform: translate(0px, 150px);
                }
                90%, 100%{
                    transform: translate(0, 0);
                }
            }
            .Clouds{
                z-index: -1;
                position: absolute;
                width: 100%;
                bottom: 60px;
                animation: clouds 3s linear infinite;
            }
            .Emergency-Alert{
                z-index: 3;
                position: absolute;
                opacity: 0;
                width: 70%;
                transition: opacity 0.2s linear;
            }
            .Emergency-Alert.show{
                opacity: 1;
            }
            @keyframes clouds{
                0%, 25%{
                    transform: translate(0, 0);
                }
                50%, 65%{
                    transform: translate(0px, 5px);
                }
                90%, 100%{
                    transform: translate(0, 0);
                }
            }
        </style>
    </head>
    <body>

        <!-- Scaled Frame Container -->
        <div class="Frame" id="gameFrame">
            <div class="ClickWindow">
                <img class="Dont" src="Images/Asset/First page/Bfbrbs Don_t.png">
                <img class="Finger" src="Images/Asset/First page/Bfrbs Finger.png">
                <img class="First" src="Images/Asset/First page/Bfrbs First Page.png">
            </div>
            <div class="DialougeWindow">
                <audio class="Warn-Sound" src="Images/Asset/Sound/warningsound.mp3" loop></audio>
                <img class="Emergency-Alert" src="Images/Asset/Bg 1/Emergency Alert.png">
                <img class="Clouds" src="Images/Asset/Bg 1/Bg1 Clouds.png">
                <img class="Background" src="Images/Asset/Bg 1/Bg1 Foreground.png">
                <div class="dialouge-wrapper">
                    <div class="character-wrapper">
                        <img class="character" src="Images/Asset/Farmer/Farmer Fight.png">
                        <img class="dialouge" src="Images/Asset/Dialogue/Part 1/Part 1/1-P1Dialogue.png">
                    </div>
                </div> 
            </div>
        </div>

        <script>
            // Responsively fit internal resolution (1920x1080) to screen bounds
            const GAME_WIDTH = 1920;
            const GAME_HEIGHT = 1080;
            const gameFrame = document.getElementById("gameFrame");

            function fitGameToWindow() {
                const scaleX = window.innerWidth / GAME_WIDTH;
                const scaleY = window.innerHeight / GAME_HEIGHT;
                const scale = Math.min(scaleX, scaleY);

                gameFrame.style.transform = `scale(${scale})`;
            }

            window.addEventListener("resize", fitGameToWindow);
            fitGameToWindow();
        </script>
        <script src="IntroductionOne.js"></script>
    </body>
</html>
