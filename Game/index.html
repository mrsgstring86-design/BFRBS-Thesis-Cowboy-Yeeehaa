<html lang="eng">
    <head>
        <title> Loading.. </title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Podkova:wght@400..800&display=swap" rel="stylesheet">
        <style>
            *{
              margin: 0;
              padding: 0;
              box-sizing: border-box;
              font-family: "Podkova", serif;
            }
            body{
             display: flex;
             justify-content: center;
             align-items: center;
             background-color: #F6E6D0;
             animation: fadeInPage 0.5s ease-in-out forwards;
            }
            .background{
                position: absolute;
                display: flex;
                opacity: 0.5;
                width: 100%;
                height: 100%;
            }
            .progress-wrapping{
                max-width: 420px;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
            }
            .loading-text{
                color:black;
                margin-bottom: 10px;
                font-size:x-large;
                font-weight: 600;
            }
                
            .WindMillContainer{
                position: relative;
                width: 110px;
                height: 300px;
                margin-bottom: 20px;
            }
            .Base-Windmill{
               position: absolute;
               width: 100%;
               height: 100%;
                top: 0;
                left: 0;
                z-index: 1;
            }
            .Fan-Windmill{
                position: absolute;
                width: 200px;
                height: 200px;
                top: -45px;
                left: -45px;
                z-index: 2;
                animation: spin 3s linear infinite;
            }
            @keyframes fadeInPage {
                from { opacity: 0; }
                to { opacity: 1; }
            }


            @keyframes spin {
                0%{transform: rotate(0deg);}
                100%{transform: rotate(360deg);}
            }

        </style>
    </head>
    <body>
        <img class="background" src="Images/Asset/Bfrbs Texture.png">
        <div class="progress-wrapping">
            <div class="WindMillContainer">
                <img class="Base-Windmill" src="Images/Asset/Loading/base-milwind.png">
                <img class="Fan-Windmill" src="Images/Asset/Loading/blade.png">
            </div>
            <div class="loading-text">Loading...</div>
        </div>
            <script>
    let loadingText = document.querySelector(".loading-text");
    let widthscore = 0;
    const loadingStates = ["Loading", "Loading.", "Loading..", "Loading..."];
    
    function UpdateProgress(){
        const currentIndex = loadingStates.indexOf(loadingText.textContent);
        loadingText.textContent = loadingStates[(currentIndex + 1) % loadingStates.length];

        if (widthscore < 10) {
            widthscore++;
        } else {
            loadingText.textContent = "Finished";
            clearInterval(progressInterval);
            
            setTimeout(() => {
                // Check if the player has already finished the pressbutton dialogue
                const isDialogueFinished = localStorage.getItem("dialogueCompleted");

                if (isDialogueFinished === "true") {
                    window.location.href = 'map.html';
                } else {
                    window.location.href = 'pressbutton.html';
                }
            }, 1500);
        }
    }

    const progressInterval = setInterval(UpdateProgress, 500);
</script>
    </body>
</html>
<link rel="stylesheet" href="style.css">
