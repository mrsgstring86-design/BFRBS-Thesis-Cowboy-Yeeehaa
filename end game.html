<html lang="eng">
    <head>
        <title> Introduction Scene </title>
        <style>
            *{
              margin: 0;
              padding: 0;
              box-sizing: border-box;
            }
            body{
             display: flex;
             justify-content: center;
             align-items: center;
             height: 100vh;
             width: 100vw;
             background-color: #E55420; /* Black letterbox background */
             overflow: hidden;
             animation: fadeInPage 0.5s ease-in-out forwards;
            }
            @keyframes fadeInPage {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            .Background{
                position: fixed;
                left: 0;
                max-width: 1380px;
                bottom: 0;
                width: 100%;
                height: auto;
                align-items: center;
                justify-content: center;
                z-index: -2;
            }
            .dialouge-wrapper{
                display: flex;
                opacity: 0;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 100%;
                transition: opacity 0.8s linear;
            }
            .dialouge{
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                object-position: center;
            }
            .DialougeWindow{
                position: fixed;
                inset: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100vw;
                height: 100vh;
                opacity: 1;
                transition: opacity 1.5s linear;
            }
            .DialougeWindow:has(.dialouge-wrapper.show) .Emergency-Alert {
                opacity: 0;
                pointer-events: none;
            }
            .character{
                position: absolute;
                z-index: -1;
                width: 60%;
                max-width: 800px;
                height: auto;
                bottom: 28%;
                order: -1;
                left: 77%;
                transform: translateX(-50%);
                object-fit: contain;
                object-position: center;
            }
            .character-wrapper{
                position: relative;
                width: 100%;
                height: 100%;
                display: block;
            }
            @keyframes finger-press{
                0%, 25%{
                    transform: translate(0, 0);
                }
                50%, 65%{
                    transform: translate(0px, 150px);
                }
                90%, 100%{
                    transform: translate(0, 0);
                }
            }
            .Clouds{
                z-index: -1;
                position: absolute;
                width: 100%;
                bottom: 60px;
                animation: clouds 3s linear infinite;
            }
            .Emergency-Alert{
                z-index: 3;
                position: absolute;
                opacity: 0;
                width: 70%;
                transition: opacity 0.2s linear;
            }
            .Emergency-Alert.show{
                opacity: 1;
            }
            @keyframes clouds{
                0%, 25%{
                    transform: translate(0, 0);
                }
                50%, 65%{
                    transform: translate(0px, 5px);
                }
                90%, 100%{
                    transform: translate(0, 0);
                }
            }
        </style>
    </head>
    <body>
        <div class="DialougeWindow">
            <audio class="Warn-Sound" src="Images/Asset/Sound/warningsound.mp3" loop></audio>
            <img class="Emergency-Alert" src="Images/Asset/Bg 1/Emergency Alert.png">
            <img class="Clouds" src="Images/Asset/Bg 1/Bg1 Clouds.png">
            <img class="Background" src="Images/Asset/Bg 1/Bg1 Foreground.png">
            <div class="dialouge-wrapper">
                <div class="character-wrapper">
                    <img class="character" src="Images/Asset/Farmer/Farmer Fight.png">
                    <img class="dialouge" src="Images/Asset/Dialogue/Part 1/Part 1/1-P1Dialogue.png">
                </div>
            </div> 
        </div>
        <script src="IntroductionOne.js"></script>
    </body>
</html>
